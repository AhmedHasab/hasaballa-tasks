<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>لوحة التحكم - Hasaballa</title>
<style>
  body{font-family:Arial, sans-serif; direction:rtl; padding:20px;}
  h1{margin:0 0 10px}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  input,button,select{padding:6px 10px}
  table{width:100%;border-collapse:collapse;margin-top:12px}
  th,td{border:1px solid #ccc;padding:8px;text-align:right;vertical-align:top}
  th{background:#eee}
  .green{color:green;font-weight:bold;}
  .yellow{color:orange;font-weight:bold;}
  .gray{color:gray;font-weight:bold;}
  .muted{font-size:12px;color:#666}
</style>
</head>
<body>

<h1>لوحة التحكم - Hasaballa</h1>

<div class="row" style="margin-bottom:6px">
  <label>رابط السكربت:
    <input id="scriptUrl" style="width:52rem"
      value="https://script.google.com/macros/s/AKfycbxp3SOFIM17DBvdywk6wIT_-t8JxsfUlIqDrDDdCitJ9uUtWyc2f2UGedFwvpwrTZex/exec">
  </label>
</div>

<div class="row" style="margin-bottom:6px">
  <label>Admin Key:
    <input id="adminKey" style="width:30rem" value="HasaballaAdmin!2025">
  </label>
  <span class="muted" id="status">— جاري التشغيل…</span>
  <label>تحديث كل
    <select id="intervalSel">
      <option value="1000" selected>1 ث</option>
      <option value="2000">2 ث</option>
      <option value="3000">3 ث</option>
    </select>
  </label>
</div>

<table id="tbl">
  <thead>
    <tr>
      <th>تحكم</th>
      <th>الحالة</th>
      <th>IP / بلد / مدينة</th>
      <th>UserAgent</th>
      <th>من</th>
      <th>إلى</th>
      <th>المدة</th>
      <th>آخر مشاهدة</th>
      <th>آخر نشاط</th>
    </tr>
  </thead>
  <tbody></tbody>
</table>

<script>
let LIVE_TIMER = null;

const $ = (id)=> document.getElementById(id);
const fmt = (ms)=> ms ? new Date(Number(ms)).toLocaleString() : '-';
const fmtDur = (ms)=> {
  ms = Math.max(0, Number(ms||0));
  const s = Math.floor(ms/1000);
  const m = Math.floor(s/60);
  const h = Math.floor(m/60);
  const ss = s % 60, mm = m % 60;
  return `${h}h ${mm}m ${ss}s`;
};

async function post(params){
  const url = $('scriptUrl').value.trim();
  const body = new URLSearchParams(params);
  const res = await fetch(url, {method:'POST', body});
  return res.json();
}

function renderRows(rows){
  const tb = document.querySelector('#tbl tbody');
  tb.innerHTML = '';
  rows.forEach(r=>{
    const ipCountry = `${r.ip||'-'}${(r.country||r.city)?' / ':''}${(r.country||'')}${r.city?(' - '+r.city):''}`;
    const toDisplay = r.closedAt ? r.closedAt : (r.status==='gray' ? r.lastSeen : 0);
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>
        <button data-id="${r.id}" class="revoke">إلغاء</button>
        <button data-id="${r.id}" class="delete">حذف</button>
      </td>
      <td class="${r.status}">${r.status}</td>
      <td title="ID: ${r.id}">${ipCountry}</td>
      <td style="max-width:420px;word-break:break-word">${r.ua||'-'}</td>
      <td>${fmt(r.createdAt)}</td>
      <td>${fmt(toDisplay)}</td>
      <td>${fmtDur(r.durationMs)}</td>
      <td>${fmt(r.lastSeen)}</td>
      <td>${fmt(r.lastActive)}</td>
    `;
    tb.appendChild(tr);
  });

  // تحكم: إلغاء
  document.querySelectorAll('.revoke').forEach(b=>{
    b.onclick = async ()=>{
      const adminKey = $('adminKey').value.trim();
      const id = b.getAttribute('data-id');
      if(!adminKey) return alert('اكتب الـ Admin Key');
      if(!confirm('إلغاء الجلسة '+id+' ؟')) return;
      const r = await post({action:'revoke', adminKey, id});
      if(!r.ok) return alert(r.msg||'خطأ');
      await listSessions();
    };
  });

  // تحكم: حذف
  document.querySelectorAll('.delete').forEach(b=>{
    b.onclick = async ()=>{
      const adminKey = $('adminKey').value.trim();
      const id = b.getAttribute('data-id');
      if(!adminKey) return alert('اكتب الـ Admin Key');
      if(!confirm('حذف الجلسة نهائيًا '+id+' ؟')) return;
      const r = await post({action:'delete', adminKey, id});
      if(!r.ok) return alert(r.msg||'خطأ');
      await listSessions();
    };
  });
}

async function listSessions(){
  const adminKey = $('adminKey').value.trim();
  if(!adminKey){ $('status').textContent='— اكتب الـ Admin Key'; return; }
  const r = await post({ action:'list', adminKey });
  if(!r.ok){ $('status').textContent = '— خطأ في الجلب'; return; }
  renderRows(r.rows||[]);
  $('status').textContent = 'آخر تحديث: ' + new Date().toLocaleTimeString();
}

function startLive(){
  if (LIVE_TIMER) clearInterval(LIVE_TIMER);
  const tick = async ()=>{ try{ await listSessions(); } catch(e){ $('status').textContent='— خطأ مؤقت'; } };
  tick();
  const ms = Number($('intervalSel').value||1000);
  LIVE_TIMER = setInterval(tick, ms);
}

document.addEventListener('DOMContentLoaded', startLive);
$('intervalSel').addEventListener('change', startLive);
</script>

</body>
</html>
