  <h3 style="margin-top: 30px;">🧠 How to Use Hasaballa AI Platform</h3>

  <p>🟢 <strong>1. Smart Director – Automatic Mode</strong><br>
  The user writes the entire script inside the chat window, then presses a single button to start the automatic process. The system will handle everything — from visual generation to final video output:<br>
  <strong>Workflow:</strong> 1️⃣Scenario input ➜ 2️⃣Press Auto Director ➜ 3️⃣Analyze ➜ 4️⃣Generate Visuals ➜ 5️⃣Generate Voices ➜ 6️⃣Add Soundscape ➜ 7️⃣Animate & Lip Sync ➜ 8️⃣Send to Timeline Editor</p>

  <p>🟡 <strong>2. Smart Director – Manual Mode</strong><br>
  Full hands-on mode for professionals who want total control. The user can control each generation step manually — generate visuals, skip voice, choose animation style, etc. Nothing happens automatically.<br>
  <strong>Workflow:</strong> 1️⃣Scenario input ➜ 2️⃣Press Manual Director ➜ 3️⃣Analyze ➜ 4️⃣Generate Visuals ➜ 5️⃣Generate Voices ➜ 6️⃣Add Soundscape ➜ 7️⃣Animate & Lip Sync ➜ 8️⃣Send to Timeline Editor<br>
  ✅ <em>Allows complete manual control at every step.</em></p>

  <p>🔵 <strong>3. Standalone Mode (Each Tool Individually)</strong><br>
  Use any tool separately (image generator, voice cloner, animation, etc.) without needing to run a full project. Ideal for experiments, assets, or testing workflows.</p>

  <h3 style="margin-top: 30px;">🧩 How the Platform Flows</h3>
  <ol style="margin-left: 20px;">
    <li>1️⃣ User writes full script in Hasaballa GPT Chat.</li>
    <li>2️⃣ User clicks Auto Smart Director or chooses Manual Mode.</li>
    <li>3️⃣ The system processes the script → generates visuals, voices, animations, and lip sync.</li>
    <li>4️⃣ All assets go into the Timeline Editor.</li>
    <li>5️⃣ User can fine-tune scenes via Smart Edit Layer.</li>
    <li>6️⃣ Final video is exported in high quality (HD, 4K…).</li>
    <li>7️⃣ (Optional) Track views/revenue via YouTube integration.</li>
  </ol>

  <p>✉️ <em>Each developer will receive a separate document with their specific assigned tasks, chosen based on their skill set.</em></p>
